<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: Arial, sans-serif;
        }
        #webcam {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            height: 135px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            transform: scaleX(-1);
            z-index: 10;
            background-color: #111;
        }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            text-align: center;
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="error-msg">⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br>Mohon izinkan akses kamera pada browser Anda.</div>

    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry;
        let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let currentColors = new Float32Array(PARTICLE_COUNT * 3);
        let targetColors = new Float32Array(PARTICLE_COUNT * 3);
        
        let activeShapeIndex = 0;

        
        function getCloudPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 15;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 15;
            }
            return pos;
        }

        function getHeartPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = u * 2;
                pos[i * 3] = x * 0.3;
                pos[i * 3 + 1] = y * 0.3;
                pos[i * 3 + 2] = z * 0.3;
            }
            return pos;
        }

        function getUranusPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 2.5;
                    pos[i * 3] = r * Math.sin(v) * Math.cos(u);
                    pos[i * 3 + 1] = r * Math.sin(v) * Math.sin(u);
                    pos[i * 3 + 2] = r * Math.cos(v);
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const r = 3.8 + Math.random() * 2.8;
                    pos[i * 3] = r * Math.cos(theta);
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
                    pos[i * 3 + 2] = r * Math.sin(theta);
                }
            }
            return pos;
        }

        function getTextPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 120;

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('I LOVE YOU', 300, 75);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const validPixels = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData.data[index] > 128) {
                        validPixels.push({
                            x: (x - canvas.width / 2) * 0.03,
                            y: -(y - canvas.height / 2) * 0.03
                        });
                    }
                }
            }

            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                pos[i * 3] = pt.x + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.03;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
            return pos;
        }




        function getMiddleFingerPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 500;

            // Solid hand silhouette with the middle finger raised.
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(105, 270);
            ctx.lineTo(105, 220);
            ctx.quadraticCurveTo(105, 190, 130, 190);
            ctx.quadraticCurveTo(150, 190, 155, 215);
            ctx.lineTo(155, 75);
            ctx.quadraticCurveTo(155, 42, 188, 42);
            ctx.quadraticCurveTo(220, 42, 220, 75);
            ctx.lineTo(220, 215);
            ctx.lineTo(230, 180);
            ctx.quadraticCurveTo(240, 150, 265, 160);
            ctx.quadraticCurveTo(290, 170, 280, 200);
            ctx.lineTo(275, 235);
            ctx.quadraticCurveTo(295, 205, 318, 220);
            ctx.quadraticCurveTo(340, 235, 325, 265);
            ctx.lineTo(300, 330);
            ctx.quadraticCurveTo(280, 400, 215, 420);
            ctx.lineTo(155, 420);
            ctx.quadraticCurveTo(105, 400, 105, 350);
            ctx.lineTo(75, 300);
            ctx.quadraticCurveTo(55, 270, 80, 250);
            ctx.quadraticCurveTo(100, 235, 120, 265);
            ctx.closePath();
            ctx.fill();

            const pixels = [];
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                        pixels.push({ x, y });
                    }
                }
            }

            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = pixels[Math.floor(Math.random() * pixels.length)];
                pos[i * 3] = (p.x - 200) * 0.018 + (Math.random() - 0.5) * 0.025;
                pos[i * 3 + 1] = -(p.y - 250) * 0.018 + (Math.random() - 0.5) * 0.025;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 0.16;
            }
            return pos;
        }

        function getMiddleFingerColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const glow = Math.random();
                col[i * 3] = 1.0;
                col[i * 3 + 1] = 0.08 + glow * 0.18;
                col[i * 3 + 2] = 0.25 + glow * 0.35;
            }
            return col;
        }

        function getSpiderWebPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const points = [];
            const addLine = (x1, y1, x2, y2, count, spread = 0.035) => {
                for (let j = 0; j < count; j++) {
                    const t = Math.random();
                    points.push({
                        x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * spread,
                        y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * spread,
                        z: (Math.random() - 0.5) * 0.12
                    });
                }
            };

            // Radial silk strands and curved concentric web rings.
            const radius = 3.35;
            const spokes = 12;
            for (let s = 0; s < spokes; s++) {
                const a = (Math.PI * 2 * s) / spokes;
                addLine(0, 0, Math.cos(a) * radius, Math.sin(a) * radius, 420);
            }
            for (let ring = 1; ring <= 6; ring++) {
                const r = (radius * ring) / 6;
                let previous = null;
                const steps = 180;
                for (let j = 0; j <= steps; j++) {
                    const a = (Math.PI * 2 * j) / steps;
                    const wave = Math.sin(a * spokes / 2) * 0.10;
                    const point = { x: Math.cos(a) * (r + wave), y: Math.sin(a) * (r + wave) };
                    if (previous) addLine(previous.x, previous.y, point.x, point.y, 18, 0.025);
                    previous = point;
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = points[Math.floor(Math.random() * points.length)];
                pos[i * 3] = p.x;
                pos[i * 3 + 1] = p.y;
                pos[i * 3 + 2] = p.z;
            }
            return pos;
        }

        function getSpiderWebColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const blue = Math.random() > 0.48;
                const glow = Math.random() * 0.35;
                col[i * 3] = blue ? 0.08 + glow : 0.9 + glow * 0.25;
                col[i * 3 + 1] = blue ? 0.35 + glow : 0.04 + glow * 0.12;
                col[i * 3 + 2] = blue ? 1.0 : 0.08 + glow * 0.2;
            }
            return col;
        }

        function getOkRingPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const a = Math.random() * Math.PI * 2;
                const tube = (Math.random() - 0.5) * 0.32;
                const radius = 2.35 + tube;
                const depth = (Math.random() - 0.5) * 0.22;
                pos[i * 3] = Math.cos(a) * radius;
                pos[i * 3 + 1] = Math.sin(a) * radius;
                pos[i * 3 + 2] = depth;
            }
            return pos;
        }

        function getCloudColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 1] = 0.2 + Math.random() * 0.8;
                col[i * 3 + 2] = 0.5 + Math.random() * 0.5;
            }
            return col;
        }

        function getHeartColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.9 + Math.random() * 0.1;
                col[i * 3 + 1] = 0.05 + Math.random() * 0.15;
                col[i * 3 + 2] = 0.1 + Math.random() * 0.25;
            }
            return col;
        }

        function getUranusColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < PARTICLE_COUNT * 0.45) {
                    col[i * 3] = 0.35 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.85 + Math.random() * 0.15;
                    col[i * 3 + 2] = 0.9 + Math.random() * 0.1;
                } else {
                    col[i * 3] = 0.25 + Math.random() * 0.15;
                    col[i * 3 + 1] = 0.75 + Math.random() * 0.2;
                    col[i * 3 + 2] = 0.85 + Math.random() * 0.15;
                }
            }
            return col;
        }

        function getTextColor() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                col[i * 3] = 0.0;
                col[i * 3 + 1] = 1.0;
                col[i * 3 + 2] = 0.8;
            }
            return col;
        }


        function getOkRingColors() {
            const col = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const glow = Math.random();
                col[i * 3] = 0.45 + glow * 0.45;
                col[i * 3 + 1] = 0.05 + glow * 0.25;
                col[i * 3 + 2] = 0.85 + glow * 0.15;
            }
            return col;
        }

        const shapes = [
            getCloudPositions(),
            getHeartPositions(),
            getUranusPositions(),
            getTextPositions(),
            getOkRingPositions(),
            getMiddleFingerPositions()
        ];

        const shapeColors = [
            getCloudColors(),
            getHeartColors(),
            getUranusColors(),
            getTextColor(),
            getOkRingColors(),
            getMiddleFingerColors()
        ];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const initialPos = shapes[0];
            const initialCol = shapeColors[0];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPositions[i] = initialPos[i];
                targetPositions[i] = initialPos[i];
                currentColors[i] = initialCol[i];
                targetColors[i] = initialCol[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.06,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setShape(shapeIndex) {
            if (activeShapeIndex === shapeIndex) return;
            activeShapeIndex = shapeIndex;
            
            const targetPos = shapes[shapeIndex];
            const targetCol = shapeColors[shapeIndex];

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                targetPositions[i] = targetPos[i];
                targetColors[i] = targetCol[i];
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const positions = geometry.attributes.position.array;
            const colorsAttr = geometry.attributes.color.array;

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * 0.1;
                colorsAttr[i] += (targetColors[i] - colorsAttr[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            if (activeShapeIndex === 3) {
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 1) {
                particles.rotation.y += 0.01;
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 4) {
                particles.rotation.z += 0.008;
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
            } else if (activeShapeIndex === 5 || activeShapeIndex === 6) {
                particles.rotation.y = THREE.MathUtils.lerp(particles.rotation.y, 0, 0.1);
                particles.rotation.x = THREE.MathUtils.lerp(particles.rotation.x, 0, 0.1);
                particles.rotation.z = THREE.MathUtils.lerp(particles.rotation.z, 0, 0.1);
            } else if (activeShapeIndex === 2) {
                particles.rotation.y += 0.012;
                particles.rotation.x += 0.008;
                particles.rotation.z += 0.003;
            } else {
                particles.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function detectGesture(landmarks) {
            const thumbIndexDistance = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
            const isIndexOpen = landmarks[8].y < landmarks[6].y;
            const isMiddleOpen = landmarks[12].y < landmarks[10].y;
            const isRingOpen = landmarks[16].y < landmarks[14].y;
            const isPinkyOpen = landmarks[20].y < landmarks[18].y;

            // Middle-finger gesture: only the middle finger is raised.
            if (!isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 5;
            }

            // OK sign: thumb and index fingertips touch while the other three fingers stay raised.
            if (thumbIndexDistance < 0.055 && isMiddleOpen && isRingOpen && isPinkyOpen) {
                return 4;
            }

            if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 3;
            }
            if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 2;
            }
            if (!isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                return 1;
            }
            if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen) {
                return 0;
            }

            return activeShapeIndex;
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const shapeIndex = detectGesture(results.multiHandLandmarks[0]);
                setShape(shapeIndex);
            }
        }

        const videoElement = document.getElementById('webcam');
        const errorMsg = document.getElementById('error-msg');

        initThreeJS();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                videoElement.srcObject = stream;
                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 480,
                    height: 360
                });
                cameraUtils.start();
            })
            .catch((err) => {
                console.error("Akses kamera ditolak/gagal:", err);
                errorMsg.style.display = "block";
            });
    </script>
</body>
</html>
